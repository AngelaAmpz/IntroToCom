<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulgo_Lab14</title>

    <style>
        header,body{
            margin: 0;
            padding: 0;
            background-color: #dfdfdf;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        *{
            box-sizing: border-box;
        }

        .container{
            background-color: white;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 0 6px 10px grey;
            padding: 5px 10px;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"]{
            padding: 5px 10px;
            border:1px solid black;
        }

        input[type="email"]{
            padding: 5px 10px;
            border:1px solid black;
        }
        
        select {
            padding: 5px 10px;
            border:1px solid black;
        }

        textarea{
            padding: 5px 10px;
            border:1px solid black;
            width: 100%;
        }

        form {
            width: 670px;
        }

        form > div{
            margin: 10px 0;
        }

        button{
            border: 1px solid black;
            border-radius: 7px;
            background-color: white;
            padding: 8px 20px;
        }

        .submit{
            background-color: #028181 ;
            color: white;
            transition: 0.3s ease-in-out;

        }

        .submit:hover{
            background-color: #03c0c0 ;
        }

        .reset{
            background-color: #fcfcfc ;
            color: rgb(2, 2, 2);
            transition: 0.3s ease-in-out;
            border: 1px solid black;

        }

        .reset:hover{
            background-color: #bababa ;
        }

        .buttons{
            margin: 15px 0;
        }

        footer{
            text-align: center;
            padding: 10px 10px;
            margin-top: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Join the Club &mdash; Angel A. Pulgo
        </h1>
        <div>
            <form action="">
                <div class="form">
                    <label for="form">Full name</label>
                    <input type="text" placeholder="">
                </div>

                <div class="form">
                    <label for="">Email</label>
                    <input type="email" placeholder="">
                </div>

                <div class="form">
                    <label for="">Program</label>
                    <select name="" id="">
                        <option value="BSCS">BSCS</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSBA">BSBA</option>
                        <option value="BSCRIM">BSCRIM</option>
                    </select>
                </div>
                 <div class="form-button">
                    <label for="">Why do you want to join?</label>
                    <div>
                        <textarea rows="5" placeholder=""></textarea>
                    </div>
                </div>
                 <div class="buttons">
                     <button type="submit" class="submit">Sign up</button>
                     <button type="reset" class="reset">Clear</button>
                 </div>

                </div>

            </form>

        </div>
    </div>

    <footer>
        &copy; 2026 ICS Coding Club &middot; Prepared by Pulgo_Angel
    </footer>
    
</body>
</html>
