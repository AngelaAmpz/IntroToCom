<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulgo_Lab14</title>

    <style>

         /*
            Usability Notes:
            1. Contrast: White navigation text on a dark teal background
                for readability.
            2. Click target size: Navigation links use 10px 15px padding
                to provide a larger clickable area.
            3. Keyboard test: Tested with the Tab key to check that
                links receive visible focus and the Events dropdown
                opens when focused.
        */

        :root{
            --primary:#2b2bc7;
            --hover-primary:#03c0c0;
            --header-primary:#0101ba;

        }

        header,body{
            margin: 0;
            padding: 0;
            background-color: #dfdfdf;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--header-primary);
            padding: 0 35px;
        }

        .title {
            background-color: var(--header-primary);
            color: white;
            padding: 15px 25px;
            font-size: 30px;
            font-weight: bold;
        }

        *{
            box-sizing: border-box;
        }

        nav{
            background-color: var(--header-primary);
            padding: 0 35px;

        }
        
        /* MAIN NAV */
        .navi nav > ul {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 4px;
        }

        .navi nav > ul > li {
            position: relative;
        }

        .navi a {
            display: block;
            padding: 10px 15px;
            color: #ffffff;
            text-decoration: none;
            transition: 0.3s ease-in-out;
         }

        .navi a:hover {
            background-color: var(--hover-primary);
            color: #ffffff;
            border: 1px solid #0101ba;
            border-radius: 5px;
        }

        .navi a:focus-visible{
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        } 
        /* prmimary color code #0101d6*/

        /* NAV FOR EVENTS */
        .sub-menu{
            display: none;
            position: absolute;
            top: 100%;
            min-width: 180px;
            left: 0;
            list-style: none;
            background-color: var(--header-primary);
            z-index: 10;
        }

        .sub-menu nav {
            padding: 0;
        }

        .sub-menu ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navi nav > ul > li:hover > .sub-menu,
        .navi nav > ul > li:focus-within > .sub-menu {
            display: block;

        }

        .container{
            width: 100%;
            background-color: white;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 0 6px 10px grey;
            padding: 5px 10px;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label{
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"]{
            padding: 5px 10px;
            border:1px solid black;
        }

        input[type="text"]:focus{
            outline: 2px solid lightseagreen;
        }

        input[type="email"]{
            padding: 5px 10px;
            border:1px solid black;
        }

        input[type="email"]:focus{
            outline: 2px solid lightseagreen;
        }
        
        select {
            padding: 5px 10px;
            border:1px solid black;
        }

        select:focus{
            outline: 2px solid lightseagreen;
        }

        textarea{
            padding: 5px 10px;
            border:1px solid black;
            width: 100%;
        }

        textarea:focus{
            outline: 2px solid lightseagreen;
        }
        
        form > div{
            margin: 10px 0;
        }

        button{
            border: 1px solid black;
            border-radius: 7px;
            background-color: white;
            padding: 8px 20px;
        }

        .submit{
            background-color: #028181 ;
            color: white;
            transition: 0.3s ease-in-out;
            cursor: pointer;

        }

        .submit:hover{
            background-color: #03c0c0 ;
        }

        .submit:active{
            background-color: #00ba00;
        }

        .reset{
            background-color: #fcfcfc ;
            color: rgb(2, 2, 2);
            transition: 0.3s ease-in-out;
            border: 1px solid black;
            cursor: pointer;
        }

        .reset:hover{
            background-color: #bababa ;
        }

        .buttons{
            margin: 15px 0;
        }

        footer{
            text-align: center;
            padding: 10px 10px;
            margin-top: 150px;
        }
    </style>
</head>
<body>
    <div class="top">
        <header>
            <div class="title">
                ICS Coding Club
            </div>
        </header>
    
        <div class="navi">
            <nav>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Events</a>
                        <div class="sub-menu"> 
                            <nav>
                                <ol>
                                    <li><a href="">HTML Clinic</a></li>
                                    <li><a href="">CSS Showdown</a></li>
                                    <li><a href="">Portfolio Night</a></li>
                                </ol>
                            </nav>
                        </div>
                    </li>
                    <li><a href="">Join</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1>
            Join the Club &mdash; Angel A. Pulgo
        </h1>
        <div>
            <form action="">
                <div class="form">
                    <label for="form">Full name</label>
                    <input type="text" placeholder="">
                </div>

                <div class="form">
                    <label for="">Email</label>
                    <input type="email" placeholder="">
                </div>

                <div class="form">
                    <label for="">Program</label>
                    <select name="" id="">
                        <option value="BSCS">BSCS</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSBA">BSBA</option>
                        <option value="BSCRIM">BSCRIM</option>
                    </select>
                </div>
                 <div class="form-button">
                    <label for="">Why do you want to join?</label>
                    <div>
                        <textarea rows="5" placeholder=""></textarea>
                    </div>
                </div>
                 <div class="buttons">
                     <button type="submit" class="submit">Sign up</button>
                     <button type="reset" class="reset">Clear</button>
                 </div>

                </div>

            </form>

        </div>
    </div>

    <footer>
        &copy; 2026 ICS Coding Club &middot; Prepared by Pulgo_Angel
    </footer>
    
</body>
</html>
